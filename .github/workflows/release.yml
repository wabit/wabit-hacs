name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Never ship a release that cannot even parse.
      - run: node --check dist/wabit-cards.js
      - run: node test/card.test.mjs
      - run: node test/room-card.test.mjs
      - run: node test/bin-card.test.mjs
      - run: node test/media-card.test.mjs
      - run: node test/f1-card.test.mjs

      # GitHub can deliver a tag push more than once, and a re-run is a normal
      # thing to want, so creating the release has to be safe to repeat.
      - name: Publish release with the card attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; updating its asset."
            gh release upload "${GITHUB_REF_NAME}" dist/wabit-cards.js --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              dist/wabit-cards.js
          fi
