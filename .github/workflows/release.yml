name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Never ship a release that cannot even parse.
      - run: node --check dist/wabit-cards.js
      - run: node test/card.test.mjs
      - run: node test/room-card.test.mjs
      - run: node test/bin-card.test.mjs
      - run: node test/media-card.test.mjs
      - run: node test/f1-card.test.mjs

      - name: Publish release with the card attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/wabit-cards.js
