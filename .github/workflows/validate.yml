name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin

  tests:
    name: Card tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check dist/wabit-cards.js
      - run: node test/card.test.mjs
      - run: node test/room-card.test.mjs
      - run: node test/bin-card.test.mjs
      - run: node test/media-card.test.mjs
      - run: node test/f1-card.test.mjs
      - run: node test/air-card.test.mjs
