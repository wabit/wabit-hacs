<script src="../dist/wabit-cards.js"></script>

<script>
/* Twelve hours of readings, stamped like the history API returns them. */
const HOURS = 12;
const POINTS = HOURS * 6;
const NOW = Date.now();

function series(end, drift, n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const v = end - drift * (1 - t) + drift * 0.4 * Math.sin(t * 6.2 + end);
    out.push({ s: String(v), lu: (NOW - (1 - t) * HOURS * 3600000) / 1000 });
  }
  return out;
}

const READINGS = {
  co2: ["carbon_dioxide", "ppm", 0],
  pm2_5: ["pm25", "\u00b5g/m\u00b3", 2],
  pm10: ["pm10", "\u00b5g/m\u00b3", 2],
  pm1_0: ["pm1", "\u00b5g/m\u00b3", 2],
  pm4_0: ["pm25", "\u00b5g/m\u00b3", 2],
  voc_index: ["aqi", "", 0],
  nox_index: ["aqi", "", 0],
  air_temperature: ["temperature", "\u00b0C", 1],
  air_humidity: ["humidity", "%", 1],
  air_pressure: ["atmospheric_pressure", "hPa", 1],
};

const NAMES = {
  co2: "CO2", pm2_5: "PM 2.5", pm10: "PM 10", pm1_0: "PM 1.0", pm4_0: "PM 4.0",
  voc_index: "VOC index", nox_index: "NOx index",
  air_temperature: "Air temperature", air_humidity: "Air humidity",
  air_pressure: "Air pressure",
};

/* How far each reading drifted over the window, so the lines differ. */
const DRIFT = {
  co2: -180, pm2_5: 1.4, pm10: 1.9, pm1_0: 0.8, pm4_0: 1.7,
  voc_index: 11, nox_index: -1.4,
  air_temperature: 1.6, air_humidity: -5, air_pressure: 2.2,
};

function makeHass(values, dark) {
  const entities = {};
  const states = {};
  const history = {};
  for (const [key, [dc, unit, precision]] of Object.entries(READINGS)) {
    const id = "sensor.air_puck_v1_0_" + key;
    entities[id] = { entity_id: id, device_id: "d_puck", display_precision: precision };
    states[id] = {
      state: String(values[key]),
      attributes: {
        device_class: dc, unit_of_measurement: unit, state_class: "measurement",
        friendly_name: "Office - Environment Sensor " + NAMES[key],
      },
    };
    history[id] = series(values[key], DRIFT[key], POINTS);
  }
  return {
    themes: { darkMode: dark },
    locale: { language: "en-GB" },
    areas: { office: { area_id: "office", name: "Office", aliases: [] } },
    devices: { d_puck: { area_id: "office" } },
    entities,
    states,
    callService: () => {},
    callWS: () => Promise.resolve(history),
  };
}

const GOOD = {
  co2: 413, pm2_5: 1.89727973937988, pm10: 2.73941874504089,
  pm1_0: 1.15892851352692, pm4_0: 2.45424818992615,
  voc_index: 18, nox_index: 2,
  air_temperature: 27.8625946044922, air_humidity: 42.1805152893066,
  air_pressure: 1007.26422119141,
};
const STUFFY = { ...GOOD, co2: 1643, voc_index: 182, pm2_5: 9.4 };

function mount(paneClass, caption, dark, values, hoverChart, extra) {
  const pane = document.createElement("div");
  pane.className = "pane " + paneClass;
  const cap = document.createElement("div");
  cap.className = "caption";
  cap.textContent = caption;
  pane.appendChild(cap);
  const card = document.createElement("wabit-air-card");
  pane.appendChild(card);
  document.body.appendChild(pane);
  card.setConfig({ area: "office", hours: HOURS, ...(extra || {}) });
  card.hass = makeHass(values, dark);
  if (hoverChart) {
    // Hold one chart open so the screenshot shows the hover readout.
    setTimeout(() => {
      const h = card._els.chartEls.find((c) => c.spec.key === hoverChart);
      if (!h) return;
      // Headless captures do not advance CSS transitions, so the readout would
      // be caught part way through its fade.
      h.tip.style.transition = "none";
      card._hover(h, 0.62);
    }, 250);   // past the tooltip's fade-in, so the capture is not mid-transition
  }
}

mount("light", "Fresh, reading the PM chart", false, GOOD, "pm");
mount("dark", "Fresh", true, GOOD);
mount("light", "Needs a window open", false, STUFFY, "co2");
mount("light", "show_chart_background: false", false, GOOD, null,
      { show_chart_background: false });
</script>
